name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (-Wall -Wextra -Werror)
        run: make test

      - name: Sanitizers (AddressSanitizer + UBSan)
        run: make sanitize
